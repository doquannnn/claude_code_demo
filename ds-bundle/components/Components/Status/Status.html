<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status message — states</title>
    <style>
      :root {
        --color-bg: #5a9e8a;
        --color-on-bg: #ffffff;
        --color-player-x: #d64545;
        --color-player-o: #2f6fb3;
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --fs-md: 1.2rem;
        --tracking-wide: 0.05em;
        --space-1: 0.25rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-6: 2rem;
      }
      .ds-card {
        font-family: var(--font-sans);
        background: var(--color-bg);
        color: var(--color-on-bg);
        padding: var(--space-6);
        min-height: 100%;
        box-sizing: border-box;
        margin: 0;
      }
      .ds-card h2 {
        margin: 0 0 var(--space-4);
        font-size: var(--fs-md);
        letter-spacing: var(--tracking-wide);
      }

      /* Component under test: .status */
      .status {
        font-size: var(--fs-md);
        margin: var(--space-3) 0;
        min-height: 1.5rem;
      }
      .status b[data-player="X"] { color: var(--color-player-x); }
      .status b[data-player="O"] { color: var(--color-player-o); }
    </style>
  </head>
  <body class="ds-card">
    <h2>Status message — states</h2>
    <div class="status">Player <b data-player="X">X</b>'s turn</div>
    <div class="status">AI is thinking…</div>
    <div class="status">Player <b data-player="O">O</b> wins!</div>
    <div class="status">It's a draw!</div>
  </body>
</html>
